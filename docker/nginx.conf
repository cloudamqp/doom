server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/wasm text/css;
    # Serves freedoom1.wad.gz, built next to the 28 MB WAD
    gzip_static on;

    # The page's files must match each other after a deploy, and
    # bin/configure-broker.js may change config.js. ETags keep it cheap.
    add_header Cache-Control no-cache;
}
