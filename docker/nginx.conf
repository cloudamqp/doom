server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/wasm text/css;
    # Serves freedoom1.wad.gz, built next to the 28 MB WAD
    gzip_static on;

    # bin/configure-broker.js may change the broker URL in a mounted config.js
    location = /js/config.js {
        add_header Cache-Control no-cache;
    }
}
